[project]
name = "dof-ingest"
version = "0.1.0"
description = "Idempotent, robots-aware ingestion pipeline for the Diario Oficial de la Federación (Mexico)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "certifi>=2026.7.22",
    # httpx: HTTP/2, first-class timeouts, and a transport layer that is trivial
    # to stub in tests. `requests` has no default timeout and no HTTP/2.
    "httpx>=0.28",
    # selectolax: Lexbor-backed HTML parser. The DOF index is a 100 KB flat
    # table; selectolax parses it far faster than html.parser and, unlike
    # BeautifulSoup, needs no second dependency to be fast.
    "selectolax>=0.3.21",
]

[project.scripts]
dof-ingest = "dof_ingest.cli:main"
dof-qa = "dof_qa.cli:main"

[project.optional-dependencies]
# Generation via Claude is opt-in: the retrieval layer and the whole eval
# harness run without it, so CI needs no API key.
anthropic = ["anthropic>=0.116"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dof_ingest", "src/dof_qa"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# SIM905 wants a list literal instead of `"...".split()`. For the Spanish
# stopword and vocabulary blocks, the wrapped-prose form is what makes them
# reviewable; a 200-element list literal is not.
ignore = ["SIM905"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

# The anthropic SDK is an optional extra; CI type-checks without it installed.
[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
